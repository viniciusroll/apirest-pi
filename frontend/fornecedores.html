<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fornecedores — Sistema de Gestao</title>
  <link rel="stylesheet" href="shared.css">
</head>
<body>
  <div id="sidebar-placeholder"></div>

  <div class="main">
    <div id="topbar-placeholder"></div>

    <div class="page-content">
      <div class="page-header">
        <h1 class="page-title">Fornecedores</h1>
        <button class="btn btn-primary" onclick="abrirModalNovo()">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Novo Fornecedor
        </button>
      </div>

      <div class="table-card">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Nome</th>
              <th>CNPJ</th>
              <th>Endereco</th>
              <th>Prazo Entrega</th>
              <th>Emails</th>
              <th>Telefones</th>
              <th>Acoes</th>
            </tr>
          </thead>
          <tbody id="tbodyFornecedores">
            <tr class="loading-row"><td colspan="8">Carregando...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-backdrop hidden" id="modalBackdrop">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title" id="modalTitle">Novo Fornecedor</span>
        <button class="modal-close" onclick="fecharModal()">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <div class="form-group">
        <label>Nome</label>
        <input type="text" id="fNome" placeholder="Razao social do fornecedor">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>CNPJ (somente numeros)</label>
          <input type="text" id="fCnpj" placeholder="00000000000000" maxlength="14">
        </div>
        <div class="form-group">
          <label>Prazo de Entrega (dias)</label>
          <input type="number" id="fTempoEntrega" placeholder="7" min="1" step="1">
        </div>
      </div>
      <div class="form-group">
        <label>Endereco</label>
        <input type="text" id="fEndereco" placeholder="Rua, numero, cidade">
      </div>

      <div class="form-group">
        <label>Emails</label>
        <div class="multi-value-list" id="emailsList"></div>
        <button type="button" class="btn-add-row" onclick="addEmailRow()">+ Adicionar email</button>
      </div>

      <div class="form-group">
        <label>Telefones (somente numeros, 10 ou 11 digitos)</label>
        <div class="multi-value-list" id="telefonesList"></div>
        <button type="button" class="btn-add-row" onclick="addTelefoneRow()">+ Adicionar telefone</button>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="fecharModal()">Cancelar</button>
        <button class="btn btn-primary" id="btnSalvar" onclick="salvar()">Salvar</button>
      </div>
    </div>
  </div>

  <!-- Confirm -->
  <div class="modal-backdrop hidden" id="confirmBackdrop">
    <div class="confirm-dialog">
      <h3>Excluir fornecedor</h3>
      <p>Tem certeza que deseja excluir este fornecedor?</p>
      <div class="confirm-dialog-footer">
        <button class="btn btn-secondary" onclick="fecharConfirm()">Cancelar</button>
        <button class="btn btn-danger" id="btnConfirmDelete" onclick="confirmarDelete()">Excluir</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    let fornecedores = [];
    let editandoId = null;
    let deletandoId = null;

    document.addEventListener('DOMContentLoaded', async () => {
      if (!authGuard()) return;
      document.getElementById('sidebar-placeholder').innerHTML = sidebarHTML('fornecedores.html');
      document.getElementById('topbar-placeholder').innerHTML = topbarHTML();
      initTopbar();
      await carregar();
    });

    function filtrarTabela(q) {
      const cleaned = q.trim();
      const rows = document.querySelectorAll('#tbodyFornecedores tr');
      if (!cleaned) {
        rows.forEach(r => { r.style.display = ''; });
        return;
      }

      const numericOnly = /^[0-9]+$/.test(cleaned);
      rows.forEach(r => {
        const id = r.cells[0]?.textContent?.trim() || '';
        const nome = r.cells[1]?.textContent?.toLowerCase() || '';
        const cnpj = r.cells[2]?.textContent?.toLowerCase() || '';
        const endereco = r.cells[3]?.textContent?.toLowerCase() || '';
        const prazo = r.cells[4]?.textContent?.toLowerCase() || '';
        const emails = r.cells[5]?.textContent?.toLowerCase() || '';
        const telefones = r.cells[6]?.textContent?.toLowerCase() || '';

        const visible = numericOnly
          ? id === cleaned
          : [nome, cnpj, endereco, prazo, emails, telefones].some(field => field.includes(cleaned.toLowerCase()));

        r.style.display = visible ? '' : 'none';
      });
    }

    async function carregar() {
      try {
        fornecedores = await api('/fornecedores');
        renderTabela(fornecedores);
      } catch (e) { toast(e.message, 'error'); }
    }

    function renderTabela(lista) {
      const tbody = document.getElementById('tbodyFornecedores');
      if (!lista.length) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:32px;color:#94a3b8">Nenhum fornecedor cadastrado</td></tr>';
        return;
      }
      tbody.innerHTML = lista.map(f => `
        <tr>
          <td>${f.id_fornecedor}</td>
          <td>${escHtml(f.nome)}</td>
          <td>${escHtml(formatCnpj(f.cnpj))}</td>
          <td>${escHtml(f.endereco || '-')}</td>
          <td>${f.tempo_entrega ? f.tempo_entrega + ' dias' : '-'}</td>
          <td>${escHtml((f.emails || []).join(', ') || '-')}</td>
          <td>${escHtml((f.telefones || []).join(', ') || '-')}</td>
          <td>
            <div class="table-actions">
              <button class="btn-icon btn-icon-edit" onclick="abrirModalEditar(${f.id_fornecedor})" title="Editar">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
              </button>
              <button class="btn-icon btn-icon-delete" onclick="abrirConfirmDelete(${f.id_fornecedor})" title="Excluir">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
              </button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    function formatCnpj(cnpj) {
      if (!cnpj || cnpj.length !== 14) return cnpj;
      return `${cnpj.slice(0,2)}.${cnpj.slice(2,5)}.${cnpj.slice(5,8)}/${cnpj.slice(8,12)}-${cnpj.slice(12)}`;
    }

    function abrirModalNovo() {
      editandoId = null;
      document.getElementById('modalTitle').textContent = 'Novo Fornecedor';
      document.getElementById('fNome').value = '';
      document.getElementById('fCnpj').value = '';
      document.getElementById('fTempoEntrega').value = '';
      document.getElementById('fEndereco').value = '';
      document.getElementById('emailsList').innerHTML = '';
      document.getElementById('telefonesList').innerHTML = '';
      addEmailRow();
      addTelefoneRow();
      document.getElementById('modalBackdrop').classList.remove('hidden');
    }

    function abrirModalEditar(id) {
      const f = fornecedores.find(x => x.id_fornecedor === id);
      if (!f) return;
      editandoId = id;
      document.getElementById('modalTitle').textContent = 'Editar Fornecedor';
      document.getElementById('fNome').value = f.nome || '';
      document.getElementById('fCnpj').value = f.cnpj || '';
      document.getElementById('fTempoEntrega').value = f.tempo_entrega || '';
      document.getElementById('fEndereco').value = f.endereco || '';

      document.getElementById('emailsList').innerHTML = '';
      (f.emails || ['']).forEach(e => addEmailRow(e));
      if (!(f.emails || []).length) addEmailRow();

      document.getElementById('telefonesList').innerHTML = '';
      (f.telefones || ['']).forEach(t => addTelefoneRow(t));
      if (!(f.telefones || []).length) addTelefoneRow();

      document.getElementById('modalBackdrop').classList.remove('hidden');
    }

    function fecharModal() { document.getElementById('modalBackdrop').classList.add('hidden'); }

    function addEmailRow(val = '') {
      const list = document.getElementById('emailsList');
      const row = document.createElement('div');
      row.className = 'multi-value-row';
      row.innerHTML = `<input type="email" placeholder="email@exemplo.com" value="${escHtml(val)}">
        <button type="button" class="btn-icon btn-icon-delete" onclick="this.parentElement.remove()">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>`;
      list.appendChild(row);
    }

    function addTelefoneRow(val = '') {
      const list = document.getElementById('telefonesList');
      const row = document.createElement('div');
      row.className = 'multi-value-row';
      row.innerHTML = `<input type="text" placeholder="11999999999" maxlength="11" value="${escHtml(val)}">
        <button type="button" class="btn-icon btn-icon-delete" onclick="this.parentElement.remove()">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>`;
      list.appendChild(row);
    }

    async function salvar() {
      const nome = document.getElementById('fNome').value.trim();
      const cnpj = document.getElementById('fCnpj').value.trim().replace(/\D/g,'');
      const tempo_entrega = parseInt(document.getElementById('fTempoEntrega').value);
      const endereco = document.getElementById('fEndereco').value.trim();
      const emails = [...document.querySelectorAll('#emailsList input')].map(i => i.value.trim()).filter(Boolean);
      const telefones = [...document.querySelectorAll('#telefonesList input')].map(i => i.value.trim().replace(/\D/g,'')).filter(Boolean);

      if (!nome || !cnpj || !endereco || isNaN(tempo_entrega) || !emails.length || !telefones.length) {
        toast('Preencha todos os campos obrigatorios', 'error'); return;
      }

      const btn = document.getElementById('btnSalvar');
      btn.disabled = true;
      try {
        const body = { nome, cnpj, endereco, tempo_entrega, emails, telefones };
        if (editandoId) {
          await api(`/fornecedores/${editandoId}`, { method: 'PUT', body: JSON.stringify(body) });
          toast('Fornecedor atualizado');
        } else {
          await api('/fornecedores', { method: 'POST', body: JSON.stringify(body) });
          toast('Fornecedor cadastrado');
        }
        fecharModal();
        await carregar();
      } catch (e) {
        toast(e.message, 'error');
      } finally {
        btn.disabled = false;
      }
    }

    function abrirConfirmDelete(id) { deletandoId = id; document.getElementById('confirmBackdrop').classList.remove('hidden'); }
    function fecharConfirm() { document.getElementById('confirmBackdrop').classList.add('hidden'); }

    async function confirmarDelete() {
      const btn = document.getElementById('btnConfirmDelete');
      btn.disabled = true;
      try {
        await api(`/fornecedores/${deletandoId}`, { method: 'DELETE' });
        toast('Fornecedor excluido');
        fecharConfirm();
        await carregar();
      } catch (e) {
        toast(e.message, 'error');
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
